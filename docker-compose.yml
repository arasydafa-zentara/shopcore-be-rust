services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      timeout: 3s
      retries: 20

  bank:
    build: ./bank_sim
    environment:
      APP_URL: http://app:8000
      BANK_SECRET: bank-shared-secret-2019
      BANK_LATENCY_MS: "0"
      BANK_DROP_RATE: "0"
    ports:
      - "5001:5001"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
      BANK_URL: http://bank:5001
      BANK_SECRET: bank-shared-secret-2019
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      bank:
        condition: service_started
